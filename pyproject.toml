[build-system]
requires = ["setuptools>=41", "wheel", "setuptools_scm[toml]>=6.2", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "polyptich"
authors = [
    {name = "Wouter Saelens", email = "wouter.saelens@gmail.com"},
]
description = "Extra visualization functions"
requires-python = ">=3.8"
keywords = ["visualization"]
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "flask",
    "jinja2",
    "matplotlib",
    "numpy",
    "pandas",
    "PyJWT[crypto]",
    "waitress",
]
dynamic = ["version", "readme"]
license = "MIT"

[project.urls]
"Homepage" = "https://github.com/instantomics/polyptich"
"Bug Tracker" = "https://github.com/instantomics/polyptich/issues"

[project.scripts]
polyptich-www = "polyptich.www.server:main"
polyptich-www-examples = "polyptich.www.examples:main"

[project.entry-points."polyptich.www.endpoints"]
"polyptich.overview-grid" = "polyptich.www.overview:OverviewGridEndpoint"

[tool.setuptools.dynamic]
readme = {file = "README.md", content-type = "text/markdown"}

[project.optional-dependencies]
dev = [
    "pytest",
]
test = [
    "pytest",
    "ruff",
]
www = [
    "openpyxl",
    "plotly",
    "pyarrow",
]

[tool.setuptools.package-data]
"polyptich.www" = ["templates/*.html", "static/*.css", "static/*.js", "static/*.txt"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore",
]

[tool.pylint.'MESSAGES CONTROL']
max-line-length = 120
disable = [
    "too-many-arguments",
    "not-callable",
    "redefined-builtin",
    "redefined-outer-name",
]

[tool.ruff]
line-length = 100
include = ['src/**/*.py']
exclude = ['scripts/*']
